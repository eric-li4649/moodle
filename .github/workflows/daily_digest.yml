name: Daily Digest & Enforcer

on:
  schedule:
    - cron: "0 22 * * *"   # 日本時間 朝7:00 (UTC 22:00)
  workflow_dispatch:

jobs:
  arxiv-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python arxiv_digest.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

  moodle-enforcer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python moodle_enforcer.py
        env:
          MOODLE_ICAL_URL: ${{ secrets.MOODLE_ICAL_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
